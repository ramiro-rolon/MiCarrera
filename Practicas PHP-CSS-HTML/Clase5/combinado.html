<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinado</title>
</head>
<body>
    <table border="1" align="center" width="100" height="100" align="center" cellpadding="20">
        <tr align="center">
            <td colspan="2">1</td>
            
            <td>3</td>
        </tr>
        <tr align="center">
            <td>4</td>
            <td>5</td>
            <td rowspan="2">6</td>
        </tr>
        <tr align="center">
            <td>7</td>
            <td>8</td>
        </tr>
    </table>
</body>
</html>
